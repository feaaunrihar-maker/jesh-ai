<script>
(function initJeshSelfHealingArchitect() {
  function showDeployCountdown(label) {
    var old = document.getElementById('jeshDeployTimerToast');
    if (old) old.remove();
    var sec = 40;
    var toast = document.createElement('div');
    toast.id = 'jeshDeployTimerToast';
    toast.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:14px 18px;border-radius:12px;z-index:999999;box-shadow:0 10px 25px rgba(0,0,0,0.35);font-size:13px;border:1px solid #3b82f6;max-width:320px;';

    var iv = setInterval(function() {
      sec--;
      var sp = document.getElementById('jeshSecCount');
      if (sp) sp.textContent = sec;
      if (sec <= 0) {
        clearInterval(iv);
        var base = window.location.href.split('?')[0].split('#')[0];
        var hash = window.location.hash || '';
        window.location.href = base + '?v=' + Date.now() + hash;
      }

  }

    else if (t.includes('Undo GitHub')) setTimeout(function() { showDeployCountdown('पिछला बैकअप वापस आ रहा है'); }, 3500);
  });
})();
